# Binary: A,G,E -> non_small_cell (0), B -> small_cell (1)
# Same layout as lung_pet_ct_dx.yaml; use with DATA_ROOT=Lung-PET-CT-Dx-PNG
# (PNG conversion updates pipeline_metadata.csv image paths under that root).
dataset_name: Lung-PET-CT-Dx-PNG

modalities:
  CT:
    folder: CT
    classes:
      non_small_cell: 0
      small_cell: 1
  PT:
    folder: PT
    classes:
      non_small_cell: 0
      small_cell: 1

metadata:
  file: pipeline_metadata.csv
  image_column: image_path
  split_column: split
