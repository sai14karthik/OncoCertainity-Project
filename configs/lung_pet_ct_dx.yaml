# Lung-PET-CT-Dx (DICOM) and Lung-PET-CT-Dx-PNG (same folder layout after conversion).
# Binary: A,G,E -> non_small_cell (0), B -> small_cell (1)
# Layout: CT/{non_small_cell,small_cell}, PT/{non_small_cell,small_cell}, pipeline_metadata.csv at DATA_ROOT.
dataset_name: Lung-PET-CT-Dx

modalities:
  CT:
    folder: CT
    classes:
      non_small_cell: 0
      small_cell: 1
  PT:
    folder: PT
    classes:
      non_small_cell: 0
      small_cell: 1

metadata:
  file: pipeline_metadata.csv
  image_column: image_path
  split_column: split
